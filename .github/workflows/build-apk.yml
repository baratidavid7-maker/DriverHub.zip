
name: Build DriverHub APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DriverHub_Download_Fresh.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract DriverHub source
        shell: bash
        run: |
          set -euo pipefail
          test -f DriverHub_Download_Fresh.zip || {
            echo '::error::ZIP file is missing.'
            exit 1
          }
          unzip -q -o DriverHub_Download_Fresh.zip
          test -f DriverHub-Android/app/build.gradle.kts || {
            echo '::error::Android project not found.'
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        working-directory: DriverHub-Android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriverHub-APK
          path: DriverHub-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
